name = "breachwatcher-proxy"
main = "src/index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Binding KV pour la mise en cache des résultats d'analyse pendant 7 jours
# Créez le namespace avec : npx wrangler kv:namespace create BREACH_CACHE
# Et pour le preview : npx wrangler kv:namespace create BREACH_CACHE --preview
[[kv_namespaces]]
binding = "BREACH_CACHE"
id = "VOTRE_KV_NAMESPACE_ID"
preview_id = "VOTRE_KV_NAMESPACE_PREVIEW_ID"

[vars]
ENVIRONMENT = "production"
# Configuration du fournisseur d'actualités / brèches
NEWS_PROVIDER = "generic" # Options: "newsapi", "gnews", "generic"
NEWS_API_BASE_URL = "https://newsapi.org/v2"

# Pour les secrets comme NEWS_API_KEY :
# En local : définissez-les dans .dev.vars
# En production : exécutez `npx wrangler secret put NEWS_API_KEY`

